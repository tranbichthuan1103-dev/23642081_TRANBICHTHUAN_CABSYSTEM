openapi: 3.0.0
info:
  title: Ride Booking API
  version: 1.0.0
  description: API để khách hàng nhập điểm đón, điểm đến, chọn loại xe, xem giá dự kiến và đặt xe.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /rides/estimate:
    post:
      tags: [Ride Booking]
      summary: Xem giá cước dự kiến
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideRequest'
      responses:
        '200':
          description: Tính giá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimatedFare: {type: number, example: 85000}
                  currency: {type: string, example: VND}
        '400':
          description: Dữ liệu điểm đi hoặc loại xe không hợp lệ
  /rides:
    post:
      tags: [Ride Booking]
      summary: Xác nhận đặt xe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideRequest'
      responses:
        '201':
          description: Đặt xe thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  rideId: {type: string, example: ride_001}
                  status: {type: string, example: FINDING_DRIVER}
        '400':
          description: Yêu cầu đặt xe không hợp lệ
components:
  schemas:
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, format: double, example: 10.7769}
        longitude: {type: number, format: double, example: 106.7009}
        address: {type: string, example: 123 Nguyễn Huệ, Quận 1}
    RideRequest:
      type: object
      required: [pickup, destination, vehicleType]
      properties:
        pickup: {$ref: '#/components/schemas/Location'}
        destination: {$ref: '#/components/schemas/Location'}
        vehicleType: {type: string, enum: [MOTORBIKE, CAR_4, CAR_7], example: CAR_4}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
