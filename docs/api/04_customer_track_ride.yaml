openapi: 3.0.0
info:
  title: Ride Tracking API
  version: 1.0.0
  description: API theo dõi trạng thái, vị trí tài xế và ETA của chuyến đi.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /rides/{rideId}/tracking:
    get:
      tags: [Ride Tracking]
      summary: Theo dõi chuyến đi
      security: [{ bearerAuth: [] }]
      parameters:
        - name: rideId
          in: path
          required: true
          schema: {type: string}
          example: ride_001
      responses:
        '200':
          description: Thông tin theo dõi chuyến đi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [FINDING_DRIVER, DRIVER_ACCEPTED, DRIVER_ARRIVING, PICKED_UP, IN_PROGRESS, COMPLETED, CANCELLED]
                  driverLocation:
                    $ref: '#/components/schemas/Location'
                  etaMinutes:
                    type: integer
                    example: 5
        '404':
          description: Không tìm thấy chuyến đi
components:
  schemas:
    Location:
      type: object
      properties:
        latitude: {type: number, format: double, example: 10.7769}
        longitude: {type: number, format: double, example: 106.7009}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
