openapi: 3.0.0
info:
  title: Driver Availability API
  version: 1.0.0
  description: API chuyển đổi trạng thái sẵn sàng nhận chuyến của tài xế.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /drivers/me/status:
    put:
      tags: [Driver Availability]
      summary: Cập nhật trạng thái hoạt động
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [AVAILABLE, OFFLINE]
                  example: AVAILABLE
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '400':
          description: Trạng thái không hợp lệ
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
