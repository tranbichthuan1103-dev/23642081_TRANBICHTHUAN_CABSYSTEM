openapi: 3.0.0
info:
  title: Driver Ride Acceptance API
  version: 1.0.0
  description: API để tài xế tiếp nhận hoặc từ chối chuyến đi trong thời gian quy định.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /driver/rides/{rideId}/decision:
    post:
      tags: [Driver Ride]
      summary: Chấp nhận hoặc từ chối chuyến đi
      security: [{ bearerAuth: [] }]
      parameters:
        - name: rideId
          in: path
          required: true
          schema: {type: string}
          example: ride_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [ACCEPT, REJECT]
                  example: ACCEPT
      responses:
        '200':
          description: Cập nhật quyết định thành công
        '404':
          description: Không tìm thấy chuyến đi
        '409':
          description: Chuyến đã được tài xế khác nhận hoặc đã hết thời gian phản hồi
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
