openapi: 3.0.0
info:
  title: Driver History and Income API
  version: 1.0.0
  description: API tra cứu chuyến đi đã thực hiện và tổng thu nhập của tài xế.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /drivers/me/rides:
    get:
      tags: [Driver History]
      summary: Xem lịch sử chuyến đi
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách chuyến đi đã thực hiện
  /drivers/me/income:
    get:
      tags: [Driver Income]
      summary: Xem tổng thu nhập
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date}
          example: "2026-09-01"
        - name: to
          in: query
          schema: {type: string, format: date}
          example: "2026-09-30"
      responses:
        '200':
          description: Thông tin thu nhập
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalIncome: {type: number, example: 12500000}
                  currency: {type: string, example: VND}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
