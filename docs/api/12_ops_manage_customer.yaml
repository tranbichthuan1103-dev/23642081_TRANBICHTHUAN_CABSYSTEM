openapi: 3.0.0
info:
  title: Operations Customer Management API
  version: 1.0.0
  description: API cho nhân viên vận hành tìm kiếm và xem chi tiết hồ sơ khách hàng.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /operations/customers:
    get:
      tags: [Operations - Customers]
      summary: Tìm kiếm khách hàng
      security: [{ bearerAuth: [] }]
      parameters:
        - name: phone
          in: query
          schema: {type: string}
        - name: name
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Danh sách khách hàng phù hợp
  /operations/customers/{customerId}:
    get:
      tags: [Operations - Customers]
      summary: Xem chi tiết khách hàng
      security: [{ bearerAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {type: string}
          example: cus_001
      responses:
        '200':
          description: Thông tin khách hàng
        '404':
          description: Không tìm thấy khách hàng
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
