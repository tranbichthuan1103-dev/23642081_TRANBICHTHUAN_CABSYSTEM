openapi: 3.0.0
info:
  title: Operations Ride Monitoring API
  version: 1.0.0
  description: API giám sát các chuyến đi đang diễn ra và vị trí/trạng thái tài xế.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /operations/rides/active:
    get:
      tags: [Operations - Monitoring]
      summary: Xem danh sách chuyến đang diễn ra
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [FINDING_DRIVER, DRIVER_ACCEPTED, DRIVER_ARRIVING, PICKED_UP, IN_PROGRESS]
      responses:
        '200':
          description: Danh sách chuyến đang diễn ra kèm vị trí và trạng thái tài xế
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
