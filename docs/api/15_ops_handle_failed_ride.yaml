openapi: 3.0.0
info:
  title: Operations Failed Ride API
  version: 1.0.0
  description: API để nhân viên vận hành can thiệp xử lý chuyến đi gặp sự cố.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /operations/rides/{rideId}/intervention:
    post:
      tags: [Operations - Ride Issues]
      summary: Can thiệp xử lý chuyến lỗi
      security: [{ bearerAuth: [] }]
      parameters:
        - name: rideId
          in: path
          required: true
          schema: {type: string}
          example: ride_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action:
                  type: string
                  enum: [CANCEL_RIDE, ADJUST_STATUS]
                  example: CANCEL_RIDE
                targetStatus:
                  type: string
                  example: CANCELLED
                reason:
                  type: string
                  example: Tài xế gặp sự cố kỹ thuật.
      responses:
        '200':
          description: Xử lý chuyến thành công
        '400':
          description: Hành động hoặc trạng thái không hợp lệ
        '404':
          description: Không tìm thấy chuyến
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
