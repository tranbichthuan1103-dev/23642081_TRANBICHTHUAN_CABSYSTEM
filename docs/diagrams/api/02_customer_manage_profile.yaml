openapi: 3.0.0
info:
  title: Customer Profile API
  version: 1.0.0
  description: API xem và cập nhật hồ sơ khách hàng.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /customers/me:
    get:
      tags: [Customer Profile]
      summary: Xem hồ sơ khách hàng
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lấy hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          description: Chưa xác thực
    put:
      tags: [Customer Profile]
      summary: Cập nhật hồ sơ khách hàng
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: Nguyễn Văn A
                email:
                  type: string
                  format: email
                  example: nguyenvana@example.com
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Dữ liệu không hợp lệ
components:
  schemas:
    CustomerProfile:
      type: object
      properties:
        id: {type: string, example: cus_001}
        phone: {type: string, example: "0901234567"}
        fullName: {type: string, example: Nguyễn Văn A}
        email: {type: string, format: email, example: nguyenvana@example.com}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
