openapi: 3.0.0
info:
  title: Customer History and Rating API
  version: 1.0.0
  description: API tra cứu lịch sử chuyến đi và đánh giá tài xế.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /customers/me/rides:
    get:
      tags: [Ride History]
      summary: Xem lịch sử chuyến đi
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách lịch sử chuyến đi
  /rides/{rideId}/rating:
    post:
      tags: [Rating]
      summary: Đánh giá tài xế
      security: [{ bearerAuth: [] }]
      parameters:
        - name: rideId
          in: path
          required: true
          schema: {type: string}
          example: ride_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: Tài xế thân thiện và lái xe an toàn.
      responses:
        '201':
          description: Đánh giá thành công
        '400':
          description: Số sao phải từ 1 đến 5
        '409':
          description: Chuyến đi đã được đánh giá
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
