openapi: 3.0.0
info:
  title: Operations Driver and Vehicle Management API
  version: 1.0.0
  description: API cho nhân viên vận hành tạo, cập nhật hồ sơ tài xế và thông tin phương tiện.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /operations/drivers:
    post:
      tags: [Operations - Drivers]
      summary: Tạo tài khoản tài xế
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, fullName]
              properties:
                phone: {type: string, example: "0912345678"}
                fullName: {type: string, example: Trần Văn B}
      responses:
        '201':
          description: Tạo tài khoản thành công
        '400':
          description: Dữ liệu không hợp lệ
  /operations/drivers/{driverId}:
    put:
      tags: [Operations - Drivers]
      summary: Cập nhật hồ sơ tài xế
      security: [{ bearerAuth: [] }]
      parameters:
        - name: driverId
          in: path
          required: true
          schema: {type: string}
          example: drv_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: {type: string, example: Trần Văn B}
                email: {type: string, format: email}
      responses:
        '200':
          description: Cập nhật thành công
  /operations/drivers/{driverId}/vehicle:
    put:
      tags: [Operations - Vehicles]
      summary: Cập nhật thông tin phương tiện
      security: [{ bearerAuth: [] }]
      parameters:
        - name: driverId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                licensePlate: {type: string, example: 59A1-12345}
                vehicleType: {type: string, enum: [MOTORBIKE, CAR_4, CAR_7]}
      responses:
        '200':
          description: Cập nhật phương tiện thành công
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
