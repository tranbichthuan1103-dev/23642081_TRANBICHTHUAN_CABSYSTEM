openapi: 3.0.0
info:
  title: Operations Transaction History API
  version: 1.0.0
  description: API tra cứu lịch sử chuyến đi và giao dịch thanh toán để hỗ trợ CSKH.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /operations/transactions:
    get:
      tags: [Operations - Transactions]
      summary: Tra cứu lịch sử giao dịch
      security: [{ bearerAuth: [] }]
      parameters:
        - name: rideId
          in: query
          schema: {type: string}
        - name: customerId
          in: query
          schema: {type: string}
        - name: paymentStatus
          in: query
          schema:
            type: string
            enum: [PENDING, PAID, FAILED, REFUNDED]
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: Danh sách giao dịch và thông tin chuyến đi
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
