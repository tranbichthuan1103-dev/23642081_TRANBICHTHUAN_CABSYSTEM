openapi: 3.0.0
info:
  title: RBAC Administration API
  version: 1.0.0
  description: API quản trị vai trò và phân quyền truy cập cho người dùng nội bộ.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /admin/roles:
    get:
      tags: [Administration - RBAC]
      summary: Xem danh sách vai trò
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách vai trò
  /admin/roles/{roleId}/permissions:
    put:
      tags: [Administration - RBAC]
      summary: Cấu hình quyền cho vai trò
      security: [{ bearerAuth: [] }]
      parameters:
        - name: roleId
          in: path
          required: true
          schema: {type: string}
          example: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items: {type: string}
                  example: [RIDE_VIEW, CUSTOMER_VIEW, TRANSACTION_VIEW]
      responses:
        '200':
          description: Cấu hình phân quyền thành công
        '403':
          description: Không có quyền quản trị
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
