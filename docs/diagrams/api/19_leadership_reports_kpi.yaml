openapi: 3.0.0
info:
  title: Management Reports and KPI API
  version: 1.0.0
  description: API cung cấp báo cáo tổng số chuyến, doanh thu, tỷ lệ hoàn thành, tỷ lệ hủy và KPI tài xế.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /management/reports:
    get:
      tags: [Management Reports]
      summary: Xem báo cáo hoạt động
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
          example: "2026-09-01"
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
          example: "2026-09-30"
      responses:
        '200':
          description: Báo cáo thống kê hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRides: {type: integer, example: 12500}
                  totalRevenue: {type: number, example: 850000000}
                  completionRate: {type: number, example: 0.92}
                  cancellationRate: {type: number, example: 0.08}
  /management/kpis/drivers:
    get:
      tags: [Management Reports]
      summary: Tra cứu KPI hiệu suất tài xế
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách KPI tài xế
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
